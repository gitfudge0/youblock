name: Check and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-popup.mjs
      - run: node scripts/test-search.mjs
      - run: node scripts/test-reload.mjs
      - run: node scripts/test-menu.mjs
      - run: node scripts/test-engine.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: youblock-browser-packages
          path: artifacts/
